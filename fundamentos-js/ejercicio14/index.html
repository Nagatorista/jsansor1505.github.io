<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 14 - Palíndromo</title>
  <link rel="stylesheet" href="../assets/styles/styles.css">
</head>
<body>
  <div class="container">
    <h1>Ejercicio 14: Comprobar Palíndromo</h1>
    <div class="enunciado">Verifica si una palabra es un palíndromo comparando la versión limpia original con la invertida.</div>

    <div class="form-group">
      <label for="palabra">Ingresa una palabra:</label>
      <input type="text" id="palabra" placeholder="Ej: Reconocer">
    </div>
    <button onclick="verificarPalindromo()">Verificar</button>

    <div id="resultado" class="resultado-capa">Resultado...</div>
  </div>

  <script>
    function esPalindromo(palabra) {
      const limpia = palabra.toLowerCase().replace(/[\W_]/g, '');
      const invertida = limpia.split("").reverse().join("");
      return limpia === invertida;
    }

    function verificarPalindromo() {
      const val = document.getElementById("palabra").value;
      if(!val) return;
      const resultado = esPalindromo(val);
      document.getElementById("resultado").innerText = `¿"${val}" es un palíndromo?: ${resultado ? "SÍ" : "NO"}`;
    }
  </script>
</body>
</html>
