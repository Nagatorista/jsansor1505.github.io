<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 19 - Promedio</title>
  <link rel="stylesheet" href="../assets/styles/styles.css">
</head>
<body>
  <div class="container">
    <h1>Ejercicio 19: Promedio de un Array</h1>
    <div class="enunciado">Calcula la media o promedio de una serie de números utilizando el método <code>reduce()</code>.</div>

    <div class="form-group">
      <label for="numeros">Números separados por comas:</label>
      <input type="text" id="numeros" value="10, 20, 30, 40, 50">
    </div>
    <button onclick="calcularPromedio()">Calcular Promedio</button>

    <div id="resultado" class="resultado-capa">Resultado...</div>
  </div>

  <script>
    function calcularPromedioArray(arr) {
      if (arr.length === 0) return 0;
      const suma = arr.reduce((acum, val) => acum + val, 0);
      return suma / arr.length;
    }

    function calcularPromedio() {
      const input = document.getElementById("numeros").value;
      const arrayNums = input.split(",").map(n => Number(n.trim())).filter(n => !isNaN(n));
      const promedio = calcularPromedioArray(arrayNums);
      
      document.getElementById("resultado").innerText = `Array: [${arrayNums.join(", ")}]\nEl promedio es: ${promedio.toFixed(2)}`;
    }
  </script>
</body>
</html>
