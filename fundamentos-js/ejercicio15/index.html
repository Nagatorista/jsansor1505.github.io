<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 15 - Números Primos</title>
  <link rel="stylesheet" href="../assets/styles/styles.css">
</head>
<body>
  <div class="container">
    <h1>Ejercicio 15: Números Primos</h1>
    <div class="enunciado">Encuentra todos los números primos desde 1 hasta el número límite indicado.</div>

    <div class="form-group">
      <label for="limite">Límite máximo:</label>
      <input type="number" id="limite" value="50">
    </div>
    <button onclick="calcularPrimos()">Buscar Primos</button>

    <div id="resultado" class="resultado-capa">Resultado...</div>
  </div>

  <script>
    function esPrimo(num) {
      if (num < 2) return false;
      for (let i = 2; i <= Math.sqrt(num); i++) {
        if (num % i === 0) return false;
      }
      return true;
    }

    function calcularPrimos() {
      const max = Number(document.getElementById("limite").value);
      const primos = [];
      for (let i = 1; i <= max; i++) {
        if (esPrimo(i)) primos.push(i);
      }
      document.getElementById("resultado").innerText = `Primos entre 1 y ${max}:\n[${primos.join(", ")}]`;
    }
  </script>
</body>
</html>
