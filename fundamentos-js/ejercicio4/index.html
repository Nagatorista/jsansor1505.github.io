<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 4 - Suma con Prompt</title>
  <link rel="stylesheet" href="../assets/styles/styles.css">
</head>
<body>
  <div class="container">
    <h1>Ejercicio 4: Suma con Prompt</h1>
    <div class="enunciado">
      Ingresa dos números mediante <code>prompt()</code>, conviértelos con <code>Number()</code> y muestra la suma.
    </div>

    <button onclick="calcularSuma()">Pedir Números y Sumar</button>
    <div id="resultado" class="resultado-capa">Resultados de la suma...</div>
  </div>

  <script>
    function calcularSuma() {
      const n1 = prompt("Ingresa el primer número:");
      const n2 = prompt("Ingresa el segundo número:");

      if (n1 !== null && n2 !== null) {
        const num1 = Number(n1);
        const num2 = Number(n2);
        const suma = num1 + num2;

        console.log(`La suma de ${num1} y ${num2} es: ${suma}`);
        document.getElementById("resultado").innerText = `${num1} + ${num2} = ${suma}`;
      } else {
        document.getElementById("resultado").innerText = "Operación cancelada.";
      }
    }
  </script>
</body>
</html>
