<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 8 - Número Azar</title>
  <link rel="stylesheet" href="../assets/styles/styles.css">
</head>
<body>
  <div class="container">
    <h1>Ejercicio 8: Número Aleatorio en Rango</h1>
    <div class="enunciado">Genera un número aleatorio entero dentro de un intervalo especificado, p. ej. <code>azar(-5, 10)</code>.</div>

    <div class="form-group">
      <label>Mínimo:</label>
      <input type="number" id="min" value="-5">
      <label>Máximo:</label>
      <input type="number" id="max" value="10">
    </div>
    <button onclick="generarAzar()">Generar Número</button>

    <div id="resultado" class="resultado-capa">Resultado...</div>
  </div>

  <script>
    function azar(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generarAzar() {
      const min = Number(document.getElementById("min").value);
      const max = Number(document.getElementById("max").value);
      const res = azar(min, max);
      document.getElementById("resultado").innerText = `Número aleatorio entre ${min} y ${max}: ${res}`;
    }
  </script>
</body>
</html>
